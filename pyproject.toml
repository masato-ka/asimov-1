[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asimov-1"
version = "0.1.0"
description = "Asimov-1 open-hardware humanoid: fabrication tooling and mjlab locomotion training"
requires-python = ">=3.11,<3.14"
dependencies = [
    # mjlab pins mujoco~=3.11.0 / mujoco-warp and rsl-rl-lib itself.
    "mjlab>=1.6.0",
    # Listed directly so [tool.uv.sources] below can select the CUDA 12.8 wheels
    # (required for Blackwell GPUs such as the RTX 50 series).
    "torch>=2.7.0",
    # mjlab 1.6.0 pins rsl-rl-lib 5.4.2, whose wandb logger passes
    # wandb.Settings(start_method="thread"); wandb 0.29 removed that argument.
    "wandb>=0.22.3,<0.29",
]

[project.scripts]
asimov-train = "mjlab_asimov.scripts.train_cli:main"
asimov-play = "mjlab_asimov.scripts.train_cli:play"
asimov-play-keyboard = "mjlab_asimov.scripts.play_keyboard:main"

[tool.hatch.build.targets.wheel]
packages = ["training/src/mjlab_asimov"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[dependency-groups]
dev = ["pytest>=8"]
